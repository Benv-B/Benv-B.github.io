<!doctype html>
<!--
  Yoma 介绍文
  · 改文字请打开旁边的 content.md,不用碰这个文件。
  · 预览:打开本文件后按 Cmd+Shift+P,选 "Live Preview: Show Preview";
    再在左边打开 content.md 改字,保存后右边大约一秒内更新。
  · 顶部波形是 <script> 用 canvas 画的 I²C 示意图。
  · 字体从 Google Fonts 异步加载,国内打不开时自动退到系统字体,不阻塞页面。
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yoma - 面向嵌入式工程师的专门 Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Martian+Mono:wdth,wght@75..112.5,100..800&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Martian+Mono:wdth,wght@75..112.5,100..800&family=Noto+Sans+SC:wght@400;500;700&display=swap"></noscript>
<style>
  :root {
    --ground: #F3F5F8;
    --surface: #FFFFFF;
    --ink: #17212B;
    --muted: #5B6773;
    --rule: #D7DEE5;
    --accent-ink: #9C5F00;
    --trace-amber: #E3A11F;
    --trace-teal: #1E8F96;
    --code-bg: #EBEFF3;
    --slot-bg: #EDF0F4;
    --mono: "Martian Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    --sans: "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #0F151A;
      --surface: #161E25;
      --ink: #E4EAEF;
      --muted: #94A2AE;
      --rule: #283540;
      --accent-ink: #F0B443;
      --trace-amber: #F0B443;
      --trace-teal: #3EC4C1;
      --code-bg: #121920;
      --slot-bg: #131A20;
    }
  }
  :root[data-theme="dark"] {
    --ground: #0F151A;
    --surface: #161E25;
    --ink: #E4EAEF;
    --muted: #94A2AE;
    --rule: #283540;
    --accent-ink: #F0B443;
    --trace-amber: #F0B443;
    --trace-teal: #3EC4C1;
    --code-bg: #121920;
    --slot-bg: #131A20;
  }

  html { background: var(--ground); }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 17px;
    line-height: 1.75;
    overflow-wrap: break-word;
    word-break: normal;
    line-break: loose;
    text-wrap: pretty;
    -webkit-font-smoothing: antialiased;
  }
  .page {
    max-width: 880px;
    margin: 0 auto;
    padding: 56px 32px 96px;
  }

  /* ---------- type ---------- */
  .eyebrow {
    font-family: var(--mono);
    font-variation-settings: "wdth" 112.5, "wght" 500;
    font-size: 11.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    display: flex;
    flex-wrap: wrap;
    gap: 0 14px;
  }
  .eyebrow .tag { color: var(--accent-ink); }
  h1 {
    font-size: clamp(22px, 2.2vw + 10px, 34px);
    line-height: 1.25;
    font-weight: 700;
    letter-spacing: 0.01em;
    margin: 14px 0 18px;
    white-space: nowrap;
  }
  @media (max-width: 640px) {
    h1 {
      white-space: normal;
      font-size: 26px;
    }
  }
  .dek {
    font-size: 19px;
    line-height: 1.7;
    color: var(--muted);
    margin: 0;
  }
  h2 {
    font-size: 26px;
    line-height: 1.35;
    font-weight: 700;
    margin: 6px 0 18px;
    text-wrap: balance;
  }
  p { margin: 0 0 1.1em; }
  strong { font-weight: 700; }
  a {
    color: inherit;
    text-decoration: underline;
    text-decoration-color: var(--trace-amber);
    text-decoration-thickness: 1.5px;
    text-underline-offset: 4px;
  }
  a:hover { color: var(--accent-ink); }
  a:focus-visible, button:focus-visible {
    outline: 2px solid var(--accent-ink);
    outline-offset: 3px;
  }
  code {
    font-family: var(--mono);
    font-variation-settings: "wdth" 100, "wght" 500;
    font-size: 0.84em;
    background: var(--code-bg);
    padding: 1px 5px;
    border-radius: 3px;
    white-space: nowrap;
  }
  .nowrap { white-space: nowrap; }
  pre {
    font-family: var(--mono);
    font-variation-settings: "wdth" 87.5, "wght" 450;
    font-size: 13.5px;
    line-height: 1.65;
    background: var(--code-bg);
    border: 1px solid var(--rule);
    border-radius: 4px;
    padding: 16px 18px;
    overflow-x: auto;
    margin: 0 0 1.2em;
  }
  pre code { background: none; padding: 0; font-size: inherit; font-variation-settings: inherit; }
  .c { color: var(--muted); }

  /* ---------- sections ---------- */
  section {
    margin-top: 60px;
    padding-top: 28px;
    border-top: 1px solid var(--rule);
  }
  section > .eyebrow { margin-bottom: 2px; }

  /* ---------- hero trace ---------- */
  figure.trace {
    margin: 44px 0 0;
  }
  @media (min-width: 900px) {
    figure.trace { margin-inline: -56px; }
  }
  figure.trace .frame {
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 4px;
    padding: 14px 10px 8px;
  }
  figure.trace canvas {
    display: block;
    width: 100%;
    height: 172px;
  }
  figcaption {
    font-family: var(--mono);
    font-variation-settings: "wdth" 100, "wght" 400;
    font-size: 12px;
    line-height: 1.7;
    color: var(--muted);
    margin-top: 10px;
  }

  /* ---------- tools as a definition grid ---------- */
  dl.tools {
    display: grid;
    grid-template-columns: 10.5em 1fr;
    column-gap: 26px;
    row-gap: 20px;
    margin: 26px 0 30px;
  }
  dl.tools dt {
    font-family: var(--mono);
    font-variation-settings: "wdth" 100, "wght" 600;
    font-size: 14px;
    color: var(--accent-ink);
    padding-top: 5px;
    line-height: 1.4;
  }
  dl.tools dt small {
    display: block;
    font-family: var(--sans);
    font-weight: 500;
    font-size: 14.5px;
    color: var(--ink);
    margin-top: 3px;
  }
  dl.tools dd { margin: 0; }
  @media (max-width: 600px) {
    dl.tools { display: block; }
    dl.tools dt { padding-top: 0; margin-top: 20px; }
    dl.tools dt small { display: inline; margin-left: 10px; }
    dl.tools dd { margin-top: 4px; }
  }

  /* ---------- numbered walkthrough (order is the information) ---------- */
  ol.steps {
    list-style: none;
    counter-reset: step;
    padding: 0;
    margin: 18px 0 22px;
    display: grid;
    gap: 12px;
  }
  ol.steps li {
    counter-increment: step;
    display: grid;
    grid-template-columns: 2.4em 1fr;
    gap: 10px;
  }
  ol.steps li::before {
    content: counter(step, decimal-leading-zero);
    font-family: var(--mono);
    font-variation-settings: "wdth" 112.5, "wght" 600;
    font-size: 12.5px;
    color: var(--accent-ink);
    padding-top: 6px;
    font-variant-numeric: tabular-nums;
  }

  ul.plain { padding-left: 1.2em; margin: 12px 0 18px; display: grid; gap: 8px; }
  ul.plain li::marker { color: var(--accent-ink); }

  /* ---------- draft scaffolding: slots + editorial notes ---------- */
  .slot {
    border: 1.5px dashed var(--rule);
    background: var(--slot-bg);
    padding: 24px 20px;
    margin: 22px 0;
    font-family: var(--mono);
    font-variation-settings: "wdth" 100, "wght" 450;
    font-size: 12.5px;
    line-height: 1.7;
    color: var(--muted);
    display: flex;
    gap: 14px;
    align-items: flex-start;
  }
  .slot b {
    flex: none;
    color: var(--accent-ink);
    font-weight: 600;
    font-variation-settings: "wdth" 112.5, "wght" 600;
    letter-spacing: 0.06em;
  }
  .note {
    font-family: var(--mono);
    font-variation-settings: "wdth" 100, "wght" 450;
    font-size: 12.5px;
    line-height: 1.7;
    color: var(--muted);
    border-left: 2px solid var(--trace-amber);
    padding-left: 12px;
    margin: 14px 0 6px;
  }
  .note::before { content: "编辑注 · "; color: var(--accent-ink); font-weight: 600; }

  .links {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 22px;
    font-family: var(--mono);
    font-variation-settings: "wdth" 100, "wght" 500;
    font-size: 13.5px;
    margin: 6px 0 0;
    padding: 0;
    list-style: none;
  }
  footer {
    margin-top: 72px;
    padding-top: 22px;
    border-top: 1px solid var(--rule);
    font-family: var(--mono);
    font-variation-settings: "wdth" 100, "wght" 450;
    font-size: 12px;
    color: var(--muted);
    display: flex;
    flex-wrap: wrap;
    gap: 6px 20px;
  }
  @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head>
<body>
<main class="page" id="app"></main>

<script>
(function () {
  var app = document.getElementById("app");
  var last = "";
  var toolRe = /^\*\*([^*]+)\*\* · (.+?) — (.+)$/;
  var toolReColon = /^\*\*([^*]+)\*\*\s*[：:]\s*(.+)$/;
  var linkRe = /^\[[^\]]+\]\([^)]+\)$/;

  function esc(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function inline(s) {
    s = esc(s);
    s = s.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/`(.+?)`/g, "<code>$1</code>");
    s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
    s = s.replace(/[\u4e00-\u9fff]{0,4}（[^（）]*<code>[^<]*<\/code>[^（）]*）/g, '<span class="nowrap">$&</span>');
    return s;
  }

  function blocks(src) {
    var lines = src.replace(/\r\n/g, "\n").split("\n");
    var out = [];
    var i = 0;
    while (i < lines.length) {
      var line = lines[i];
      if (!line.trim()) { i++; continue; }
      if (line.slice(0, 3) === "```") {
        var buf = [];
        i++;
        while (i < lines.length && lines[i].slice(0, 3) !== "```") {
          buf.push(lines[i]);
          i++;
        }
        i++;
        out.push({ type: "pre", text: buf.join("\n") });
        continue;
      }
      if (line.slice(0, 2) === "# " && line.slice(0, 3) !== "## ") {
        out.push({ type: "h1", text: line.slice(2) });
        i++; continue;
      }
      if (line.slice(0, 3) === "## ") {
        out.push({ type: "h2", text: line.slice(3) });
        i++; continue;
      }
      if (/^注[：:]/.test(line)) {
        out.push({ type: "note", text: line.replace(/^注[：:]/, "") });
        i++; continue;
      }
      if (/^图[：:]/.test(line)) {
        out.push({ type: "slot", text: line.replace(/^图[：:]/, "") });
        i++; continue;
      }
      if (/^波形[：:]/.test(line)) {
        out.push({ type: "trace", text: line.replace(/^波形[：:]/, "") });
        i++; continue;
      }
      if (/^\d+\. /.test(line)) {
        var items = [];
        while (i < lines.length && /^\d+\. /.test(lines[i])) {
          items.push(lines[i].replace(/^\d+\. /, ""));
          i++;
        }
        out.push({ type: "ol", items: items });
        continue;
      }
      if (/^- /.test(line)) {
        var items = [];
        while (i < lines.length && /^- /.test(lines[i])) {
          items.push(lines[i].replace(/^- /, ""));
          i++;
        }
        out.push({ type: "ul", items: items });
        continue;
      }
      out.push({ type: "p", text: line });
      i++;
    }
    return out;
  }

  function renderUl(items) {
    if (items.length && items.every(function (it) { return toolRe.test(it); })) {
      return '<dl class="tools">' + items.map(function (it) {
        var m = it.match(toolRe);
        return "<dt>" + esc(m[1]) + "<small>" + inline(m[2]) + "</small></dt><dd>" + inline(m[3]) + "</dd>";
      }).join("") + "</dl>";
    }
    if (items.length && items.every(function (it) { return toolReColon.test(it); })) {
      return '<dl class="tools">' + items.map(function (it) {
        var m = it.match(toolReColon);
        return "<dt>" + esc(m[1]) + "</dt><dd>" + inline(m[2]) + "</dd>";
      }).join("") + "</dl>";
    }
    if (items.length && items.every(function (it) { return linkRe.test(it); })) {
      return '<ul class="links">' + items.map(function (it) {
        return "<li>" + inline(it) + "</li>";
      }).join("") + "</ul>";
    }
    return '<ul class="plain">' + items.map(function (it) {
      return "<li>" + inline(it) + "</li>";
    }).join("") + "</ul>";
  }

  function renderFlow(nodes, opts) {
    opts = opts || {};
    var html = "";
    nodes.forEach(function (n) {
      if (n.type === "h2") html += "<h2>" + inline(n.text) + "</h2>";
      else if (n.type === "p") html += "<p" + (opts.dek && !opts._dekUsed ? (opts._dekUsed = true, ' class="dek"') : "") + ">" + inline(n.text) + "</p>";
      else if (n.type === "note") html += '<p class="note">' + inline(n.text) + "</p>";
      else if (n.type === "slot") html += '<div class="slot"><b>图 · 待补</b><span>' + inline(n.text) + "</span></div>";
      else if (n.type === "trace") {
        html += '<figure class="trace"><div class="frame"><canvas id="trace" role="img" aria-label="' + esc(n.text) + '"></canvas></div><figcaption>' + inline(n.text) + "</figcaption></figure>";
      }
      else if (n.type === "ol") {
        html += '<ol class="steps">' + n.items.map(function (it) {
          return "<li><div>" + inline(it) + "</div></li>";
        }).join("") + "</ol>";
      }
      else if (n.type === "ul") html += renderUl(n.items);
      else if (n.type === "pre") {
        html += "<pre><code>" + esc(n.text).replace(/(#[^\n]*)/g, '<span class="c">$1</span>') + "</code></pre>";
      }
    });
    return html;
  }

  function render(md) {
    md = md.replace(/<!--[\s\S]*?-->/g, "").replace(/^\uFEFF/, "").trim();
    var parts = md.split(/\n---\n/);
    var html = "";

    parts.forEach(function (part, idx) {
      part = part.trim();
      if (!part) return;
      var nodes = blocks(part);
      var hasHeading = nodes.some(function (n) { return n.type === "h1" || n.type === "h2"; });

      if (!hasHeading) {
        html += "<footer>" + part.split("\n").filter(Boolean).map(function (line) {
          return "<span>" + esc(line.trim()) + "</span>";
        }).join("") + "</footer>";
        return;
      }

      if (idx === 0) {
        var brows = [];
        var rest = [];
        var seenH1 = false;
        nodes.forEach(function (n) {
          if (!seenH1 && n.type === "p") brows.push(n.text);
          else if (n.type === "h1") { seenH1 = true; rest.push(n); }
          else rest.push(n);
        });
        html += "<header>";
        if (brows.length) {
          html += '<div class="eyebrow">' + brows.map(function (t, i) {
            return "<span" + (i ? ' class="tag"' : "") + ">" + esc(t) + "</span>";
          }).join("") + "</div>";
        }
        rest.forEach(function (n) {
          if (n.type === "h1") html += "<h1>" + inline(n.text) + "</h1>";
        });
        html += renderFlow(rest.filter(function (n) { return n.type !== "h1"; }), { dek: true });
        html += "</header>";
        return;
      }

      var brows = [];
      var rest = [];
      var seenH2 = false;
      nodes.forEach(function (n) {
        if (!seenH2 && n.type === "p") brows.push(n.text);
        else if (n.type === "h2") { seenH2 = true; rest.push(n); }
        else rest.push(n);
      });
      html += "<section>";
      if (brows.length) {
        html += '<div class="eyebrow">' + brows.map(function (t, i) {
          return "<span" + (i === 0 ? ' class="tag"' : "") + ">" + esc(t) + "</span>";
        }).join("") + "</div>";
      }
      html += renderFlow(rest);
      html += "</section>";
    });

    app.innerHTML = html;
    var h1 = app.querySelector("h1");
    if (h1) document.title = h1.textContent;
    if (typeof window.initYomaTrace === "function") window.initYomaTrace();
  }

  function load() {
    return fetch("content.md", { cache: "no-store" }).then(function (res) {
      if (!res.ok) throw new Error(res.status + " " + res.statusText);
      return res.text();
    }).then(function (text) {
      if (text === last) return;
      last = text;
      render(text);
    }).catch(function (err) {
      if (app.childElementCount) return;
      app.innerHTML = '<header><h1>打不开正文</h1><p class="dek">请用 Live Preview 打开 <code>index.html</code>，正文在 <code>content.md</code>。(' + esc(err.message) + ")</p></header>";
    });
  }

  load();
  if (!/\.github\.io$/.test(location.hostname)) setInterval(load, 700);
})();
</script>
<script>
window.initYomaTrace = function () {
  if (window._yomaTraceOff) {
    window._yomaTraceOff.forEach(function (fn) { try { fn(); } catch (e) {} });
  }
  window._yomaTraceOff = [];
  var canvas = document.getElementById("trace");
  if (!canvas) return;

  // One I²C write to 0x48 that the slave does not acknowledge.
  // Unit time = one bit period (10 µs at 100 kHz).
  var T_END = 13.5;
  var addrBits = [1, 0, 0, 1, 0, 0, 0, 0]; // 0x48 << 1 | W
  function sclEdges() {
    var e = [[1.5, 0]];
    for (var i = 0; i < 9; i++) { e.push([2.5 + i, 1]); e.push([3 + i, 0]); }
    e.push([11.5, 1]);
    return e;
  }
  function sdaEdges() {
    var e = [[1.0, 0]]; // START: SDA falls while SCL high
    for (var i = 0; i < 8; i++) e.push([2 + i, addrBits[i]]);
    e.push([10, 1]);  // ACK slot released -> stays high = NACK
    e.push([11, 0]);  // prepare STOP
    e.push([12, 1]);  // STOP: SDA rises while SCL high
    return e;
  }
  var lanes = [
    { name: "SCL", tok: "--trace-teal", edges: sclEdges() },
    { name: "SDA", tok: "--trace-amber", edges: sdaEdges() }
  ];
  var notes = [
    { from: 1.0, to: 1.6, text: "S", hot: false },
    { from: 2.0, to: 9.0, text: "地址 0x48", hot: false },
    { from: 9.0, to: 10.0, text: "W", hot: false },
    { from: 10.0, to: 11.0, text: "NACK", hot: true },
    { from: 11.6, to: 12.3, text: "P", hot: false }
  ];

  function draw() {
    var s = getComputedStyle(document.documentElement);
    var tok = function (n) { return s.getPropertyValue(n).trim(); };
    var dpr = window.devicePixelRatio || 1;
    var W = canvas.clientWidth, H = canvas.clientHeight;
    if (!W || !H) return;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    var g = canvas.getContext("2d");
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, W, H);

    var padL = 54, padR = 14;
    var x = function (t) { return padL + (t / T_END) * (W - padL - padR); };
    var laneH = 28, gap = 18, top = 12;
    var mono = "\"Martian Mono\", ui-monospace, Menlo, Consolas, monospace";
    var sans = "\"Noto Sans SC\", \"PingFang SC\", \"Microsoft YaHei\", system-ui, sans-serif";
    var ink = tok("--ink"), muted = tok("--muted"), rule = tok("--rule"), surface = tok("--surface");

    // faint sampling ticks at every SCL rising edge
    g.strokeStyle = rule; g.lineWidth = 1; g.setLineDash([2, 3]);
    for (var i = 0; i < 9; i++) {
      var tx = Math.round(x(2.5 + i)) + 0.5;
      g.beginPath(); g.moveTo(tx, top); g.lineTo(tx, top + lanes.length * (laneH + gap) - gap); g.stroke();
    }
    g.setLineDash([]);

    // lanes
    lanes.forEach(function (lane, li) {
      var y0 = top + li * (laneH + gap);
      var yH = y0 + 3, yL = y0 + laneH - 3;
      g.fillStyle = muted;
      g.font = "500 11px " + mono;
      g.textBaseline = "middle";
      g.fillText(lane.name, 8, y0 + laneH / 2);
      g.strokeStyle = tok(lane.tok);
      g.lineWidth = 2;
      g.lineJoin = "miter";
      g.beginPath();
      var lvl = 1, yy = yH;
      g.moveTo(x(0), yy);
      lane.edges.forEach(function (e) {
        var ny = e[1] ? yH : yL;
        g.lineTo(x(e[0]), yy);
        g.lineTo(x(e[0]), ny);
        yy = ny;
      });
      g.lineTo(x(T_END), yy);
      g.stroke();
    });

    // decoded annotation row
    var ay = top + lanes.length * (laneH + gap) - gap + 12;
    var ah = 22;
    g.font = "500 11px " + mono;
    g.textAlign = "center";
    notes.forEach(function (n) {
      var x0 = Math.round(x(n.from)) + 0.5, x1 = Math.round(x(n.to)) - 0.5;
      g.beginPath();
      g.rect(x0, ay + 0.5, x1 - x0, ah);
      if (n.hot) {
        g.fillStyle = tok("--trace-amber"); g.fill();
        g.fillStyle = "#17212B";
      } else {
        g.fillStyle = surface; g.fill();
        g.strokeStyle = rule; g.lineWidth = 1; g.stroke();
        g.fillStyle = ink;
      }
      g.font = (n.hot ? "700" : "500") + " 11px " + (/[^\x00-\x7F]/.test(n.text) ? sans : mono);
      g.fillText(n.text, (x0 + x1) / 2, ay + ah / 2 + 1);
    });

    // time ruler
    var ry = ay + ah + 18;
    g.strokeStyle = rule; g.lineWidth = 1;
    g.beginPath(); g.moveTo(x(0), ry + 0.5); g.lineTo(x(T_END), ry + 0.5); g.stroke();
    g.fillStyle = muted; g.font = "400 10px " + mono; g.textAlign = "left";
    [0, 5, 10].forEach(function (t) {
      var tx = Math.round(x(t)) + 0.5;
      g.beginPath(); g.moveTo(tx, ry - 3); g.lineTo(tx, ry + 4); g.stroke();
      g.fillText(t === 0 ? "0" : (t * 10) + " µs", tx + 4, ry + 12);
    });
    g.textAlign = "right";
    g.fillText("100 kHz · 示意", x(T_END), ry + 12);
  }

  var schedule = function () { requestAnimationFrame(draw); };
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(schedule); else schedule();
  var ro = window.ResizeObserver ? new ResizeObserver(schedule) : null;
  if (ro) { ro.observe(canvas); window._yomaTraceOff.push(function () { ro.disconnect(); }); }
  else {
    window.addEventListener("resize", schedule);
    window._yomaTraceOff.push(function () { window.removeEventListener("resize", schedule); });
  }
  var mq = window.matchMedia("(prefers-color-scheme: dark)");
  if (mq.addEventListener) {
    mq.addEventListener("change", schedule);
    window._yomaTraceOff.push(function () { mq.removeEventListener("change", schedule); });
  }
  var mo = new MutationObserver(schedule);
  mo.observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
  window._yomaTraceOff.push(function () { mo.disconnect(); });
};
</script>
